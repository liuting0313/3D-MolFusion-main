experiment_name: "multiview_3dmol_sider"

data:
  name: SIDER
  data_dir: "./dataset"
  batch_size: 32
  num_workers: 4
  split_type: "scaffold"

model:
  model_type: multiview_3dmol
  hidden_dim: 160
  num_heads: 4
  dropout: 0.3
  num_tasks: 27
  task_type: classification

  predictor:
    task_type: classification
    num_tasks: 27

  node_dim: 9
  edge_dim: 3
  descriptor_dim: 30
  fingerprint_dim: 3096

  use_3d_visual: true
  use_2d_graph: true
  use_fingerprints: true

  multiview_renderer:
    image_size: 128
    background_color:
    - 255
    - 255
    - 255
    atom_scale: 0.3
    bond_width: 2
    padding: 0.15

  direction_aware_encoder:
    hidden_channels:
    - 24
    - 48
    - 96
    - 128
    dropout: 0.3                           

  gps:
    hidden_dim: 160
    num_local_layers: 3
    num_global_layers: 3
    num_heads: 4
    dropout: 0.30                             
    ffn_mult: 2
    use_mol_pe: true
    num_rbf: 32
    pe_cutoff: 10.0
    use_angle_encoding: true
    use_direction_encoding: true
    num_angle_basis: 8

  fingerprint_encoder:
    input_dim: 3096
    hidden_dim: 320
    num_layers: 3
    dropout_rate: 0.30                     
    activation: gelu
    patch_size: 24

  cross_modal_attention:
    num_heads: 4
    dropout: 0.25
    use_adaptive_gating: true
    use_cross_attention: true

training:
  seed: 42
  epochs: 200
  mixed_precision: true
  max_grad_norm: 1.0
  pos_weight: "auto"

  optimizer:
    name: AdamW
    lr: 0.00025                            
    weight_decay: 0.1                         
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    enabled: true
    name: cosineannealinglr
    T_max: 200
    eta_min: 1.0e-6

  early_stopping:
    patience: 30                      
    mode: max
    monitor: val_auc
    min_delta: 0.0002


saving:
  metric_for_best: val_auc
  save_every: 0

logging:
  wandb: false

deterministic: true
benchmark: false
